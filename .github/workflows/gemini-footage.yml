# One paid generation per run, on purpose. Results are saved to the branch `footage` for review before use.
# Needs the repo secret GEMINI_API_KEY (Google AI Studio key with billing enabled).
#   action = probe  -> checks the key, costs nothing
#   action = image  -> ONE still from gemini-nano-banana-2.1 (paid)
#   action = video  -> ONE clip from gemini-omni-1.1-flash, starting from an image already in the branch (paid per second)
name: gemini-footage
on:
  workflow_dispatch:
    inputs:
      action:
        description: "probe | image | video"
        default: probe
      name:
        description: "File name without extension (e.g. hook1)"
        default: hook1
      prompt:
        description: "Prompt (image/video). Describe the camera, not 'cinematic 8K'."
        default: ""
      size:
        description: "Image size: 1K (cheapest) or 2K"
        default: 1K
      trim:
        description: "Video: cut the result to this many seconds (the model has no duration setting; you are billed for the full clip)"
        default: "4"
permissions:
  contents: write
jobs:
  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Check secret
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::Secret GEMINI_API_KEY is missing (Settings > Secrets and variables > Actions)"; exit 1; fi
      - name: Probe (free)
        if: ${{ inputs.action == 'probe' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          node plugins/hyperframe-pro/scripts/gemini.mjs probe 2>&1 | tee /tmp/g.log || { echo "::error title=Gemini error::$(tail -n 6 /tmp/g.log | tr '\n' ' ' | cut -c1-1200)"; exit 1; }
          echo "::notice title=Gemini probe::$(tail -n 2 /tmp/g.log | tr '\n' ' ')"
      - name: Load existing footage branch
        if: ${{ inputs.action != 'probe' }}
        run: |
          git clone -q --branch footage --single-branch "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/footage 2>/dev/null || { mkdir -p /tmp/footage && cd /tmp/footage && git init -q -b footage; }
      - name: Generate ONE image
        if: ${{ inputs.action == 'image' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          if [ -z "$PROMPT" ]; then echo "::error::prompt is empty"; exit 1; fi
          set -o pipefail
          node plugins/hyperframe-pro/scripts/gemini.mjs image --prompt "$PROMPT" --out "/tmp/footage/${{ inputs.name }}.png" --size "${{ inputs.size }}" --aspect 9:16 2>&1 | tee /tmp/g.log || { echo "::error title=Gemini error::$(tail -n 6 /tmp/g.log | tr '\n' ' ' | cut -c1-1200)"; exit 1; }
      - name: Generate ONE video clip
        if: ${{ inputs.action == 'video' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          test -f "/tmp/footage/${{ inputs.name }}.png" || { echo "::error::${{ inputs.name }}.png not found in branch footage - generate the image first (action=image, same name)"; exit 1; }
          set -o pipefail
          node plugins/hyperframe-pro/scripts/gemini.mjs video --image "/tmp/footage/${{ inputs.name }}.png" --prompt "$PROMPT" --out "/tmp/footage/${{ inputs.name }}.mp4" --resolution 720p --aspect 9:16 --trim "${{ inputs.trim }}" 2>&1 | tee /tmp/g.log || { echo "::error title=Gemini error::$(tail -n 6 /tmp/g.log | tr '\n' ' ' | cut -c1-1200)"; exit 1; }
          rm -f "/tmp/footage/${{ inputs.name }}.full.mp4"
      - name: Save to branch footage
        if: ${{ inputs.action != 'probe' }}
        run: |
          cd /tmp/footage
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "footage (gemini): ${{ inputs.action }} ${{ inputs.name }} (run ${{ github.run_number }})"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" footage
